basePath: /api/v1
definitions:
  dto.ActivityBucket:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      follow_up:
        type: integer
      lead_baru:
        type: integer
    type: object
  dto.CityResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.CompetitorStats:
    properties:
      avg_price_per_mbps:
        type: number
      avg_price_per_mbps_broadband:
        type: number
      avg_price_per_mbps_dedicated:
        type: number
    type: object
  dto.CreateFollowUpInput:
    properties:
      note:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - note
    type: object
  dto.CreateLeadInput:
    properties:
      business_field:
        maxLength: 200
        type: string
      capacity_mbps:
        type: integer
      city_id:
        type: integer
      company_name:
        maxLength: 200
        minLength: 2
        type: string
      district_id:
        type: integer
      email:
        type: string
      existing_isp:
        maxLength: 100
        type: string
      lead_source_id:
        type: string
      mobile_phone:
        maxLength: 30
        type: string
      office_phone:
        maxLength: 30
        type: string
      other_services:
        maxLength: 500
        type: string
      owner_id:
        type: string
      pic_name:
        maxLength: 200
        type: string
      pic_position:
        maxLength: 100
        type: string
      price:
        minimum: 0
        type: number
      province_id:
        type: integer
      rt:
        maxLength: 10
        type: string
      rw:
        maxLength: 10
        type: string
      service_type_id:
        type: string
      street:
        maxLength: 300
        type: string
      village_id:
        type: integer
      website:
        maxLength: 200
        type: string
      zip_id:
        type: integer
    required:
    - company_name
    type: object
  dto.CreateLeadSourceInput:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.CreateServiceTypeInput:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.CreateTeamInput:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.CreateUserInput:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      role:
        enum:
        - SALES
        - LEADER
        - ADMIN_SALES
        - SU
        type: string
      team_id:
        type: string
    required:
    - email
    - name
    - password
    - role
    type: object
  dto.DashboardActivityResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/dto.ActivityBucket'
        type: array
    type: object
  dto.DashboardSalesActivityResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.SalesActivityRow'
        type: array
    type: object
  dto.DashboardSegmentsResponse:
    properties:
      any_handoff:
        type: boolean
      business_fields:
        items:
          $ref: '#/definitions/dto.SegmentRow'
        type: array
      competitor:
        $ref: '#/definitions/dto.CompetitorStats'
      isps:
        items:
          $ref: '#/definitions/dto.IspRow'
        type: array
      regions:
        items:
          $ref: '#/definitions/dto.RegionRow'
        type: array
      sources:
        items:
          $ref: '#/definitions/dto.SegmentRow'
        type: array
    type: object
  dto.DashboardStaleLeadsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.StaleLeadRow'
        type: array
    type: object
  dto.DashboardSummaryResponse:
    properties:
      follow_up:
        $ref: '#/definitions/dto.MetricCard'
      funnel:
        $ref: '#/definitions/dto.FunnelResponse'
      handoff:
        $ref: '#/definitions/dto.MetricCard'
      lead_baru:
        $ref: '#/definitions/dto.MetricCard'
      terlantar:
        $ref: '#/definitions/dto.MetricCard'
    type: object
  dto.DeactivateUserInput:
    properties:
      reassign_to_user_id:
        type: string
    type: object
  dto.DistrictResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.FollowUpResponse:
    properties:
      created_at:
        type: string
      created_by_id:
        type: string
      created_by_name:
        type: string
      id:
        type: string
      lead_id:
        type: string
      note:
        type: string
    type: object
  dto.FunnelResponse:
    properties:
      baru_to_fu_pct:
        type: integer
      fu_to_handoff_pct:
        type: integer
      lost_count:
        type: integer
      lost_pct:
        type: integer
      stages:
        items:
          $ref: '#/definitions/dto.FunnelStage'
        type: array
    type: object
  dto.FunnelStage:
    properties:
      count:
        type: integer
      name:
        type: string
      pct:
        type: integer
    type: object
  dto.IspRow:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  dto.LeadDetailResponse:
    properties:
      business_field:
        type: string
      capacity_mbps:
        type: integer
      city_id:
        type: integer
      city_name:
        type: string
      code:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      created_by_id:
        type: string
      created_by_name:
        type: string
      district_id:
        type: integer
      district_name:
        type: string
      email:
        type: string
      existing_isp:
        type: string
      follow_up_count:
        type: integer
      id:
        type: string
      is_stale:
        type: boolean
      last_follow_up_at:
        type: string
      lead_source_id:
        type: string
      lead_source_name:
        type: string
      lost_reason:
        type: string
      mobile_phone:
        type: string
      office_phone:
        type: string
      other_services:
        type: string
      owner_id:
        type: string
      owner_name:
        type: string
      owner_team_name:
        type: string
      pic_name:
        type: string
      pic_position:
        type: string
      price:
        type: number
      province_id:
        type: integer
      province_name:
        type: string
      rt:
        type: string
      rw:
        type: string
      service_type_id:
        type: string
      service_type_name:
        type: string
      status:
        type: string
      street:
        type: string
      village_id:
        type: integer
      village_name:
        type: string
      website:
        type: string
      zip_code:
        type: string
      zip_id:
        type: integer
    type: object
  dto.LeadResponse:
    properties:
      business_field:
        type: string
      capacity_mbps:
        type: integer
      city_id:
        type: integer
      city_name:
        type: string
      code:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      created_by_id:
        type: string
      district_id:
        type: integer
      email:
        type: string
      existing_isp:
        type: string
      follow_up_count:
        type: integer
      id:
        type: string
      is_stale:
        type: boolean
      last_follow_up_at:
        type: string
      lead_source_id:
        type: string
      lost_reason:
        type: string
      mobile_phone:
        type: string
      office_phone:
        type: string
      other_services:
        type: string
      owner_id:
        type: string
      owner_name:
        type: string
      owner_team_name:
        type: string
      pic_name:
        type: string
      pic_position:
        type: string
      price:
        type: number
      province_id:
        type: integer
      rt:
        type: string
      rw:
        type: string
      service_type_id:
        type: string
      status:
        type: string
      street:
        type: string
      village_id:
        type: integer
      website:
        type: string
      zip_id:
        type: integer
    type: object
  dto.LeadSourceAdminResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  dto.LeadSourceResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MetricCard:
    properties:
      change_pct:
        type: integer
      value:
        type: integer
    type: object
  dto.PaginatedLeadResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.LeadResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.ProvinceResponse:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.RefreshTokenInput:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegionRow:
    properties:
      handoff_count:
        type: integer
      lead_count:
        type: integer
      level:
        description: '"province" | "city"'
        type: string
      name:
        type: string
      parent:
        type: string
    type: object
  dto.ResetPasswordInput:
    properties:
      new_password:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - new_password
    type: object
  dto.SalesActivityRow:
    properties:
      attention_tag:
        type: string
      avg_fu_per_lead:
        type: number
      conv_pct:
        type: integer
      follow_up:
        type: integer
      handoff:
        type: integer
      last_activity:
        type: string
      lead_baru:
        type: integer
      name:
        type: string
      team_name:
        type: string
      terlantar:
        type: integer
      user_id:
        type: string
    type: object
  dto.SegmentRow:
    properties:
      conversion_pct:
        type: integer
      count:
        type: integer
      name:
        type: string
      warn:
        type: boolean
    type: object
  dto.ServiceTypeAdminResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  dto.ServiceTypeResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.StaleLeadRow:
    properties:
      code:
        type: string
      company_name:
        type: string
      days_since:
        type: integer
      owner_name:
        type: string
    type: object
  dto.TeamResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UpdateLeadInput:
    properties:
      business_field:
        maxLength: 200
        type: string
      capacity_mbps:
        type: integer
      city_id:
        type: integer
      company_name:
        maxLength: 200
        minLength: 2
        type: string
      district_id:
        type: integer
      email:
        type: string
      existing_isp:
        maxLength: 100
        type: string
      lead_source_id:
        type: string
      mobile_phone:
        maxLength: 30
        type: string
      office_phone:
        maxLength: 30
        type: string
      other_services:
        maxLength: 500
        type: string
      owner_id:
        type: string
      pic_name:
        maxLength: 200
        type: string
      pic_position:
        maxLength: 100
        type: string
      price:
        minimum: 0
        type: number
      province_id:
        type: integer
      rt:
        maxLength: 10
        type: string
      rw:
        maxLength: 10
        type: string
      service_type_id:
        type: string
      street:
        maxLength: 300
        type: string
      village_id:
        type: integer
      website:
        maxLength: 200
        type: string
      zip_id:
        type: integer
    type: object
  dto.UpdateLeadSourceInput:
    properties:
      is_active:
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  dto.UpdateLeadStatusInput:
    properties:
      lost_reason:
        maxLength: 500
        type: string
      status:
        enum:
        - FOLLOW_UP
        - HANDOFF_ODOO
        - LOST
        type: string
    required:
    - status
    type: object
  dto.UpdateProfileInput:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.UpdateServiceTypeInput:
    properties:
      is_active:
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  dto.UpdateTeamInput:
    properties:
      is_active:
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  dto.UpdateUserInput:
    properties:
      is_active:
        description: |-
          IsActive, when true, reactivates a previously deactivated user. false
          is rejected by the service — deactivation only happens through
          POST /users/:id/deactivate, which carries the active-lead-reassignment
          and last-active-administrator safety checks this endpoint doesn't.
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
      role:
        enum:
        - SALES
        - LEADER
        - ADMIN_SALES
        - SU
        type: string
      team_id:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        type: string
      team_id:
        type: string
      team_name:
        type: string
    type: object
  dto.VillageResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      zip:
        $ref: '#/definitions/dto.ZipResponse'
    type: object
  dto.ZipResponse:
    properties:
      code:
        type: string
      id:
        type: integer
    type: object
  utils.Response:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8000
info:
  contact: {}
  description: Production-ready REST API with clean architecture
  title: Fiber API Boilerplate
  version: "3.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginInput'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.TokenResponse'
              type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Logout current session
      tags:
      - auth
  /auth/logout-all:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Logout from all devices
      tags:
      - auth
  /auth/refresh:
    post:
      parameters:
      - description: Refresh token (optional if cookie present)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.RefreshTokenInput'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.TokenResponse'
              type: object
      summary: Refresh token
      tags:
      - auth
  /dashboard/activity:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardActivityResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Dashboard activity trend (lead baru vs follow-up per day)
      tags:
      - dashboard
  /dashboard/sales-activity:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardSalesActivityResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Dashboard sales activity ("Keaktifan Sales") - LEADER/ADMIN_SALES/SU
        only
      tags:
      - dashboard
  /dashboard/segments:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardSegmentsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Dashboard segments (sumber, wilayah, kompetitor, bidang usaha)
      tags:
      - dashboard
  /dashboard/stale-leads:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardStaleLeadsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Dashboard stale (terlantar) leads
      tags:
      - dashboard
  /dashboard/summary:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardSummaryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Dashboard summary (metric cards + funnel)
      tags:
      - dashboard
  /lead-sources:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.LeadSourceAdminResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List all lead sources, active and inactive (admin only)
      tags:
      - lead-sources
    post:
      parameters:
      - description: Create lead source
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLeadSourceInput'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadSourceAdminResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create lead source (admin only)
      tags:
      - lead-sources
  /lead-sources/{id}:
    patch:
      parameters:
      - description: Lead source ID
        in: path
        name: id
        required: true
        type: string
      - description: Update lead source
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateLeadSourceInput'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadSourceAdminResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update lead source (admin only)
      tags:
      - lead-sources
  /leads:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedLeadResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List leads
      tags:
      - leads
    post:
      parameters:
      - description: Create lead
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLeadInput'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create lead
      tags:
      - leads
  /leads/{code}:
    get:
      parameters:
      - description: Lead code
        in: path
        name: code
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadDetailResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get lead
      tags:
      - leads
    patch:
      parameters:
      - description: Lead code
        in: path
        name: code
        required: true
        type: string
      - description: Update lead
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateLeadInput'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update lead
      tags:
      - leads
  /leads/{code}/followups:
    get:
      parameters:
      - description: Lead code
        in: path
        name: code
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.FollowUpResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List follow-ups
      tags:
      - followups
    post:
      parameters:
      - description: Lead code
        in: path
        name: code
        required: true
        type: string
      - description: Create follow-up
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFollowUpInput'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.FollowUpResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create follow-up
      tags:
      - followups
  /leads/{code}/status:
    patch:
      parameters:
      - description: Lead code
